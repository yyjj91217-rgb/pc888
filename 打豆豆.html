<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张政打豆豆</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#02030a;
    font-family:Arial;
}

canvas{
    display:block;
    background:#02030a;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:#00ffff;
    z-index:10;
    font-size:28px;
    font-weight:bold;
    text-shadow:
    0 0 10px #00ffff,
    0 0 20px #00ffff,
    0 0 40px #00ffff;
}

#bottom{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:#ff00ff;
    font-size:22px;
    text-shadow:
    0 0 10px #ff00ff,
    0 0 20px #ff00ff;
}
</style>
</head>
<body>

<div id="ui">
LEVEL: <span id="lv">1</span><br>
KILL: <span id="kill">0</span>
</div>

<div id="bottom">
张政打豆豆
</div>

<canvas id="game"></canvas>

<script>

////////////////////////////////////////////////////

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

////////////////////////////////////////////////////

const keys = {};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;
});

////////////////////////////////////////////////////
// 玩家
////////////////////////////////////////////////////

const player = {

    x:canvas.width/2,
    y:canvas.height/2,

    r:26,

    speed:5,

    aura:0
};

////////////////////////////////////////////////////

let level = 1;
let kills = 0;

////////////////////////////////////////////////////

const enemies = [];
const bullets = [];
const particles = [];
const shockwaves = [];
const trails = [];
const rain = [];

////////////////////////////////////////////////////
// 雨
////////////////////////////////////////////////////

for(let i=0;i<500;i++){

    rain.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,

        len:Math.random()*20+10,
        speed:Math.random()*8+8
    });
}

////////////////////////////////////////////////////
// UI
////////////////////////////////////////////////////

const lvText = document.getElementById("lv");
const killText = document.getElementById("kill");

////////////////////////////////////////////////////
// 震屏
////////////////////////////////////////////////////

let shake = 0;

////////////////////////////////////////////////////
// 敌人
////////////////////////////////////////////////////

function spawnEnemy(){

    const side = Math.floor(Math.random()*4);

    let x,y;

    if(side===0){

        x=-100;
        y=Math.random()*canvas.height;
    }

    if(side===1){

        x=canvas.width+100;
        y=Math.random()*canvas.height;
    }

    if(side===2){

        x=Math.random()*canvas.width;
        y=-100;
    }

    if(side===3){

        x=Math.random()*canvas.width;
        y=canvas.height+100;
    }

    const boss = Math.random()>0.93;

    enemies.push({

        x,
        y,

        r:boss?55:28,

        hp:boss?350:70,

        speed:boss?0.6:1.5,

        pulse:0,

        color:boss?"#ff0055":"#ff8800"
    });
}

setInterval(spawnEnemy,250);

////////////////////////////////////////////////////
// 自动攻击
////////////////////////////////////////////////////

function autoShoot(){

    let nearest=null;
    let min=999999;

    enemies.forEach(e=>{

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<min){

            min=dist;
            nearest=e;
        }
    });

    if(nearest){

        const angle=Math.atan2(

            nearest.y-player.y,
            nearest.x-player.x
        );

        bullets.push({

            x:player.x,
            y:player.y,

            dx:Math.cos(angle)*18,
            dy:Math.sin(angle)*18,

            r:10,

            life:80
        });
    }
}

setInterval(autoShoot,70);

////////////////////////////////////////////////////
// 更新
////////////////////////////////////////////////////

function update(){

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    player.aura += 0.08;
}

////////////////////////////////////////////////////
// 背景
////////////////////////////////////////////////////

function drawBackground(){

    //////////////////////////////////////////////////
    // 背景渐变
    //////////////////////////////////////////////////

    const bg = ctx.createLinearGradient(

        0,
        0,
        0,
        canvas.height
    );

    bg.addColorStop(0,"#050816");
    bg.addColorStop(1,"#010104");

    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    //////////////////////////////////////////////////
    // 网格地面
    //////////////////////////////////////////////////

    ctx.strokeStyle="rgba(0,255,255,.08)";
    ctx.lineWidth=1;

    for(let x=0;x<canvas.width;x+=60){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);

        ctx.stroke();
    }

    for(let y=0;y<canvas.height;y+=60){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);

        ctx.stroke();
    }

    //////////////////////////////////////////////////
    // 雨
    //////////////////////////////////////////////////

    rain.forEach(r=>{

        r.y += r.speed;

        if(r.y>canvas.height){

            r.y=-20;
            r.x=Math.random()*canvas.width;
        }

        ctx.beginPath();

        ctx.moveTo(r.x,r.y);

        ctx.lineTo(

            r.x-4,
            r.y+r.len
        );

        ctx.strokeStyle="rgba(0,255,255,.25)";

        ctx.stroke();
    });
}

////////////////////////////////////////////////////
// 玩家
////////////////////////////////////////////////////

function drawPlayer(){

    //////////////////////////////////////////////////
    // 能量圈
    //////////////////////////////////////////////////

    ctx.beginPath();

    ctx.arc(

        player.x,
        player.y,

        player.r+18+
        Math.sin(player.aura)*8,

        0,

        Math.PI*2
    );

    ctx.strokeStyle="rgba(255,0,255,.4)";

    ctx.lineWidth=10;

    ctx.stroke();

    //////////////////////////////////////////////////
    // 核心
    //////////////////////////////////////////////////

    const glow = ctx.createRadialGradient(

        player.x,
        player.y,
        5,

        player.x,
        player.y,
        70
    );

    glow.addColorStop(0,"#ffffff");
    glow.addColorStop(0.2,"#00ffff");
    glow.addColorStop(1,"rgba(0,255,255,0)");

    ctx.beginPath();

    ctx.arc(

        player.x,
        player.y,

        player.r,

        0,

        Math.PI*2
    );

    ctx.fillStyle=glow;

    ctx.shadowBlur=80;
    ctx.shadowColor="#00ffff";

    ctx.fill();

    ctx.shadowBlur=0;
}

////////////////////////////////////////////////////
// 子弹
////////////////////////////////////////////////////

function drawBullets(){

    bullets.forEach((b,index)=>{

        b.x += b.dx;
        b.y += b.dy;

        b.life--;

        //////////////////////////////////////////////////
        // 激光尾迹
        //////////////////////////////////////////////////

        for(let i=0;i<12;i++){

            ctx.beginPath();

            ctx.arc(

                b.x-b.dx*i*0.5,

                b.y-b.dy*i*0.5,

                b.r-i*0.6,

                0,

                Math.PI*2
            );

            ctx.fillStyle=
            `rgba(0,255,255,${
                0.06*i
            })`;

            ctx.fill();
        }

        //////////////////////////////////////////////////
        // 子弹
        //////////////////////////////////////////////////

        ctx.beginPath();

        ctx.arc(

            b.x,
            b.y,

            b.r,

            0,

            Math.PI*2
        );

        ctx.fillStyle="#00ffff";

        ctx.shadowBlur=50;
        ctx.shadowColor="#00ffff";

        ctx.fill();

        //////////////////////////////////////////////////
        // 碰撞
        //////////////////////////////////////////////////

        enemies.forEach((e,eindex)=>{

            const dx=b.x-e.x;
            const dy=b.y-e.y;

            const dist=Math.sqrt(dx*dx+dy*dy);

            if(dist<e.r+b.r){

                e.hp -= 35;

                bullets.splice(index,1);

                shake = 14;

                //////////////////////////////////////////////////
                // 粒子
                //////////////////////////////////////////////////

                for(let i=0;i<40;i++){

                    particles.push({

                        x:e.x,
                        y:e.y,

                        dx:(Math.random()-0.5)*18,
                        dy:(Math.random()-0.5)*18,

                        life:60,

                        color:e.color,

                        size:Math.random()*6+2
                    });
                }

                //////////////////////////////////////////////////
                // 死亡
                //////////////////////////////////////////////////

                if(e.hp<=0){

                    kills++;

                    killText.innerText=kills;

                    enemies.splice(eindex,1);

                    shockwaves.push({

                        x:e.x,
                        y:e.y,

                        r:20,

                        life:35
                    });

                    //////////////////////////////////////////////////
                    // 升级
                    //////////////////////////////////////////////////

                    if(kills%25===0){

                        level++;

                        lvText.innerText=level;

                        player.speed += 0.25;
                    }
                }
            }
        });

        if(b.life<=0){

            bullets.splice(index,1);
        }
    });

    ctx.shadowBlur=0;
}

////////////////////////////////////////////////////
// 敌人
////////////////////////////////////////////////////

function drawEnemies(){

    enemies.forEach((e,index)=>{

        e.pulse += 0.08;

        const angle=Math.atan2(

            player.y-e.y,
            player.x-e.x
        );

        e.x += Math.cos(angle)*e.speed;
        e.y += Math.sin(angle)*e.speed;

        //////////////////////////////////////////////////
        // 外圈
        //////////////////////////////////////////////////

        ctx.beginPath();

        ctx.arc(

            e.x,
            e.y,

            e.r+14+
            Math.sin(e.pulse)*5,

            0,

            Math.PI*2
        );

        ctx.fillStyle=e.color+"22";

        ctx.fill();

        //////////////////////////////////////////////////
        // 身体渐变
        //////////////////////////////////////////////////

        const g=ctx.createRadialGradient(

            e.x-e.r*0.3,
            e.y-e.r*0.3,
            5,

            e.x,
            e.y,
            e.r
        );

        g.addColorStop(0,"#ffffff");
        g.addColorStop(0.2,e.color);
        g.addColorStop(1,"#220011");

        ctx.beginPath();

        ctx.arc(

            e.x,
            e.y,

            e.r,

            0,

            Math.PI*2
        );

        ctx.fillStyle=g;

        ctx.shadowBlur=50;
        ctx.shadowColor=e.color;

        ctx.fill();

        //////////////////////////////////////////////////
        // 红眼
        //////////////////////////////////////////////////

        ctx.beginPath();

        ctx.arc(e.x-10,e.y-5,4,0,Math.PI*2);
        ctx.arc(e.x+10,e.y-5,4,0,Math.PI*2);

        ctx.fillStyle="#ff0000";

        ctx.shadowBlur=25;
        ctx.shadowColor="#ff0000";

        ctx.fill();

        //////////////////////////////////////////////////
        // 玩家碰撞
        //////////////////////////////////////////////////

        const dx=player.x-e.x;
        const dy=player.y-e.y;

        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<player.r+e.r){

            alert("你死亡了！\n击杀："+kills);

            location.reload();
        }
    });

    ctx.shadowBlur=0;
}

////////////////////////////////////////////////////
// 粒子
////////////////////////////////////////////////////

function drawParticles(){

    particles.forEach((p,index)=>{

        p.x += p.dx;
        p.y += p.dy;

        p.life--;

        p.dx *= 0.97;
        p.dy *= 0.97;

        ctx.beginPath();

        ctx.arc(

            p.x,
            p.y,

            p.size,

            0,

            Math.PI*2
        );

        ctx.fillStyle=p.color;

        ctx.shadowBlur=20;
        ctx.shadowColor=p.color;

        ctx.fill();

        if(p.life<=0){

            particles.splice(index,1);
        }
    });

    ctx.shadowBlur=0;
}

////////////////////////////////////////////////////
// 冲击波
////////////////////////////////////////////////////

function drawShockwaves(){

    shockwaves.forEach((s,index)=>{

        s.r += 10;

        s.life--;

        ctx.beginPath();

        ctx.arc(

            s.x,
            s.y,

            s.r,

            0,

            Math.PI*2
        );

        ctx.strokeStyle=
        `rgba(255,255,255,${
            s.life/35
        })`;

        ctx.lineWidth=10;

        ctx.stroke();

        if(s.life<=0){

            shockwaves.splice(index,1);
        }
    });
}

////////////////////////////////////////////////////
// 游戏循环
////////////////////////////////////////////////////

function game(){

    requestAnimationFrame(game);

    //////////////////////////////////////////////////
    // 震屏
    //////////////////////////////////////////////////

    const sx=(Math.random()-0.5)*shake;
    const sy=(Math.random()-0.5)*shake;

    ctx.setTransform(
        1,0,0,1,sx,sy
    );

    shake *= 0.9;

    //////////////////////////////////////////////////

    drawBackground();

    update();

    drawShockwaves();

    drawParticles();

    drawBullets();

    drawEnemies();

    drawPlayer();
}

game();

////////////////////////////////////////////////////

addEventListener("resize",()=>{

    canvas.width=innerWidth;
    canvas.height=innerHeight;
});

</script>

</body>
</html>
